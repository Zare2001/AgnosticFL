[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Hub-side code (central VM): hub core, orchestrator, sim, adapters. Install next to flhub_core:
#   uv pip install -e ./flhub_core -e .
# Framework venvs install it too, so adapters can import adapters.common. Stdlib-only on purpose.
[project]
name = "agnosticfl-hub"
version = "0.2.0"
description = "Framework-agnostic federated-learning hub: one server across NVFlare, vantage6 and Flower"
readme = "README.md"
authors = [{ name = "Zare Palanciyan" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Zare2001/AgnosticFL"
Documentation = "https://github.com/Zare2001/AgnosticFL/tree/main/docs"
Changelog = "https://github.com/Zare2001/AgnosticFL/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hub*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
