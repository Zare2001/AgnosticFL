# NVIDIA NVFlare's hello-pt example (examples/hello-world/hello-pt) on the hub: the same CNN
# (flhub_core model `hello-pt`, initial weights equal to hello-pt's create_model(seed=202610)) and
# CIFAR-10, trained by hospitals on NVFlare, vantage6 and Flower in one federation with FedAvg.
# hello-pt's CIFAR-10 settings: batch 32, SGD lr 0.01, momentum 0.9, one local epoch per round.
# Each of the six sites holds 1/6 of the CIFAR-10 training set (`partition: dir0.3` for label skew).
#
#   python -m hub.sim --config configs/hello-pt.yaml --runs-dir /tmp/hello-pt-runs      # no framework
#   python -m hub.orchestrator run --config configs/hello-pt.yaml                       # testbed
#   python -m hub.orchestrator run --config configs/hello-pt.yaml --rounds 3 --name hello-pt-3r
#
# Needs the partition manifest configs/stage2/partitions/cifar10-iid.json (written on the central
# machine: python -m flhub_core.data manifests --variants cifar10-iid --out configs/stage2/partitions)
# and each site's file cifar10-iid-<site>.csv (docs/hello-pt.md).
schema: 2
name: hello-pt
experiment: hello-pt
mode: real
dataset: cifar10
partition: iid
model: hello-pt
aggregator: {name: fedavg, params: {}}
train_config: {local_epochs: 1, batch_size: 32, lr: 0.01, momentum: 0.9}
seed: 202610
rounds: 20
sites: [nvf-h1, nvf-h2, v6-h3, v6-h4, flw-h5, flw-h6]
participation: {fraction: 1.0, seed: 2026, min_sites: null}
deadline_s: 1800
online_wait_s: 600
round_retries: 1
eval: {every: 1, site_shaped: true, split: test, threads: 1}
retention: {keep_every: 10, blobs: rolling, checkpoints: all}
strict_code_version: true
