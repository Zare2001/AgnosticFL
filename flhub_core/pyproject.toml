[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flhub-core"
version = "0.2.0"
description = "Shared training code for AgnosticFL: dataset, model, deterministic train/evaluate, weights io"
requires-python = ">=3.11"
# torch is pinned per VM from deploy/versions.env (CPU index), so it is not listed with a version here.
dependencies = ["numpy>=1.26", "safetensors>=0.4", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
