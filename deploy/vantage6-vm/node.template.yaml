# vantage6 node config for one hospital (rendered by install.sh into ~/.config/vantage6/node/<site>.yaml).
# Standard vantage6 4.15 node; the only hub-specific items are the server address, the API key
# (received from the operator) and the allowed algorithm image.
api_key: ${V6_API_KEY}
api_path: /api
server_url: ${V6_SERVER_URL}
port: ${V6_SERVER_PORT}
task_dir: ${V6_TASK_DIR}
# one database per data variant (label = variant with non-identifier characters -> '_', ADR-014)
databases:
${V6_DATABASES}
# do not publish the node config: for CSV databases it lists every column name (785 per file),
# which the 4.15.2 server deletes row by row on every node (re)connect (ADR-014)
share_config: false
encryption:
  enabled: false
  private_key: null
images:
  node: ${V6_NODE_IMAGE}
policies:
  allowed_algorithms:
  - '${V6_ALLOWED_ALGORITHMS}'
logging:
  backup_count: 5
  datefmt: '%Y-%m-%d %H:%M:%S'
  file: ${V6_SITE}.log
  format: '%(asctime)s - %(name)-14s - %(levelname)-8s - %(message)s'
  level: INFO
  max_size: 1024
  use_console: true
  loggers:
  - {level: warning, name: urllib3}
  - {level: warning, name: requests}
  - {level: warning, name: engineio.client}
  - {level: warning, name: docker.utils.config}
  - {level: warning, name: docker.auth}
${V6_EXTRA_CONFIG}
