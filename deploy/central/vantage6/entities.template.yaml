# vantage6 entities for `v6 server import` (rendered by install.sh; the rendered file holds secrets).
# Site id = organisation name. hub-operator must participate in the collaboration to create tasks;
# its node record is never started. The hospitals are not here: each makes its own node API key and
# central registers organisation, membership and node with register_node.sh (central never
# generates a hospital's key).
organizations:
- name: hub-operator
  domain: flhub.local
  address1: central VM
  address2: ''
  zipcode: '0000'
  country: NL
  public_key: ''
  users:
  # an imported 'root' stops the server from creating its default root/root superuser
  - username: root
    firstname: root
    lastname: admin
    email: root@flhub.local
    password: ${V6_ROOT_PASSWORD}
  - username: hub-adapter
    firstname: hub
    lastname: adapter
    email: hub-adapter@flhub.local
    password: ${V6_ADAPTER_PASSWORD}
collaborations:
- name: flhub
  encrypted: false
  participants:
  - {name: hub-operator, api_key: ${V6_API_KEY_HUB}}
